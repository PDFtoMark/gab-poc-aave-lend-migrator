name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          mkdir -p out
          printf '1' > out/pr_number.txt
          printf 'benign content\n' > out/readme.txt
          printf 'x' > 'out/readme.txt;id;hostname;echo${IFS}INJECTED_OK;#.txt'
          ls -1 out
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out/
